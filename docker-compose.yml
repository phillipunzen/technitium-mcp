# Usage:
#   1. cp .env.example .env  and fill in your servers and secrets
#   2. docker compose up -d
#   Update: docker compose pull && docker compose up -d

services:
  technitium-mcp:
    image: ghcr.io/phillipunzen/technitium-mcp:latest
    # Or build locally from this repository:
    # build: .
    container_name: technitium-mcp
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
